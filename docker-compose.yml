version: "3.9"

services:
  # ── Backend API ──────────────────────────────────────────
  backend:
    build: ./backend
    container_name: outreach-backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # ── Celery Worker (background tasks) ─────────────────────
  celery-worker:
    build: ./backend
    container_name: outreach-celery-worker
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.worker worker -l info -c 4
    restart: unless-stopped

  # ── Celery Beat (scheduled tasks) ────────────────────────
  celery-beat:
    build: ./backend
    container_name: outreach-celery-beat
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    command: celery -A app.tasks.worker beat -l info
    restart: unless-stopped

  # ── Frontend ─────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: outreach-frontend
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: outreach-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outreach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outreach_secret}
      POSTGRES_DB: ${POSTGRES_DB:-outreach_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: outreach-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
