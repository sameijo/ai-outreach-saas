services:
  # ── Backend API ──────────────────────────────────────────
  - type: web
    name: ai-outreach-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./outreach.db
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: https://ai-outreach.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
